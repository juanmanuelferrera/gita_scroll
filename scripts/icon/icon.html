<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:"Tiro";src:url("TiroDevanagariSanskrit-Regular.ttf")}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:transparent}
.ic{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 22% 12%, #e58a1f 0%, rgba(229,138,31,0) 55%),
   radial-gradient(90% 80% at 85% 100%, #6f2a08 0%, rgba(111,42,8,0) 60%),
   linear-gradient(160deg,#c2570c 0%,#9a4508 55%,#7a3306 100%)}
.ic.round{border-radius:230px}
.art{position:absolute;inset:0;transform:translateY(42px) scale(.86);transform-origin:50% 50%}
.glyph{position:absolute;left:0;right:0;top:118px;text-align:center;font-family:"Tiro";font-size:560px;line-height:1;color:#fbf3e4;
  text-shadow:0 14px 0 rgba(90,32,4,.22),0 30px 60px rgba(60,20,2,.35)}
.chev{position:absolute;left:50%;width:150px;height:150px;transform:translateX(-50%) rotate(45deg);border-left:26px solid #fbf3e4;border-top:26px solid #fbf3e4;border-radius:10px 0 0 0;box-sizing:border-box}
.c1{top:760px;opacity:.95;width:118px;height:118px}
.c2{top:818px;opacity:.5;width:118px;height:118px}
</style>
<div class="ic" id="ic"><div class="art"><div class="glyph">गी</div><div class="chev c1"></div><div class="chev c2"></div></div></div>
